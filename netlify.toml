[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # geo-tzは座標境界データを実行時に読み込むため、モジュールとデータを同じFunctionへ含める。
  external_node_modules = ["geo-tz"]
  included_files = ["node_modules/geo-tz/data/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(self), geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)"

# 各Functionはexport const config.pathで公開API経路を直接定義する。
# forceリダイレクトで/.netlify/functions/<name>へ転送すると、custom pathを
# 持つFunctionの既定URLが無効になるため404になる。経路定義はconfig.pathへ一本化する。
