name: Native RAW ABI and regression gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Release)
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build (Release)
        run: cmake --build native/build -j"$(nproc)"
      - name: Native host Release CTest
        run: ctest --test-dir native/build --output-on-failure
      - name: Verify native host ABI
        run: bash tool/check_native_exports.sh native/build/libmobile_stack_raw.so
      - name: Configure (ASan/UBSan)
        run: |
          cmake -S native -B native/build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build (ASan/UBSan)
        run: cmake --build native/build-asan -j"$(nproc)"
      - name: Linux ASan/UBSan CTest
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1,halt_on_error=1
        run: ctest --test-dir native/build-asan --output-on-failure

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart sources
        run: flutter analyze
      - name: Run Dart unit tests
        run: flutter test
      - name: Run complete Node regression suite
        run: bash tool/run_all_node_tests.sh
      - name: Build Android arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64 -PmobileStackArm64Only=true --dart-define=MOBILE_STACK_ENABLE_DNG_METADATA=true
      - name: Build Android arm64 release APK
        run: flutter build apk --release --target-platform android-arm64 -PmobileStackArm64Only=true --dart-define=MOBILE_STACK_ENABLE_DNG_METADATA=true
      - name: Verify Android native ABI
        shell: bash
        run: |
          mkdir -p build/abi-check/android-arm64-debug build/abi-check/android-arm64-release
          unzip -p build/app/outputs/flutter-apk/app-debug.apk lib/arm64-v8a/libmobile_stack_raw.so > build/abi-check/android-arm64-debug/libmobile_stack_raw.so
          unzip -p build/app/outputs/flutter-apk/app-release.apk lib/arm64-v8a/libmobile_stack_raw.so > build/abi-check/android-arm64-release/libmobile_stack_raw.so
          if unzip -Z1 build/app/outputs/flutter-apk/app-debug.apk | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then exit 1; fi
          if unzip -Z1 build/app/outputs/flutter-apk/app-release.apk | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then exit 1; fi
          nm_tool="$(find "${ANDROID_SDK_ROOT}/ndk" -type f -name llvm-nm | sort -V | tail -n1)"
          bash tool/check_native_exports.sh build/abi-check/android-arm64-debug/libmobile_stack_raw.so "$nm_tool"
          bash tool/check_native_exports.sh build/abi-check/android-arm64-release/libmobile_stack_raw.so "$nm_tool"

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Build iOS debug without signing
        run: flutter build ios --debug --no-codesign --dart-define=MOBILE_STACK_ENABLE_DNG_METADATA=true
      - name: Verify iOS debug native ABI
        run: bash tool/check_native_exports.sh build/ios/iphoneos/Runner.app/Runner
      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign --dart-define=MOBILE_STACK_ENABLE_DNG_METADATA=true
      - name: Verify iOS release native ABI
        run: bash tool/check_native_exports.sh build/ios/iphoneos/Runner.app/Runner
